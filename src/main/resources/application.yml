spring:
  application:
    name: secure-bulletin-board

  # H2 Database (로컬 개발)
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop  # 개발 중: 자동 스키마 생성 및 초기화
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # H2 Console (로컬 디버깅용)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf
  thymeleaf:
    cache: false  # 개발 중: 템플릿 캐시 비활성화
    check-template-location: true

server:
  # 로컬에서는 8080. 배포 환경(Cloud Run 등)이 PORT 환경변수를 주입하면 그 포트로 뜬다.
  # PORT는 플랫폼이 정하는 값이므로 직접 설정하지 않는다. (docs/05_배포.md 참고)
  port: ${PORT:8080}

  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true    # JS에서 document.cookie로 세션을 읽지 못하게 한다
        same-site: lax     # 외부 사이트가 유발한 교차 출처 요청에 세션 쿠키를 싣지 않는다 (CSRF 토큰과 함께 이중 방어)
        # secure: true     # 배포(HTTPS) 시 활성화 — 로컬은 http라 켜면 로그인이 되지 않는다

logging:
  level:
    root: INFO
    com.securitybulletin: DEBUG
    org.springframework.security: DEBUG
