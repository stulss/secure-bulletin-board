spring:
  application:
    name: secure-bulletin-board

  # H2 Database (인메모리 — 재시작하면 데이터가 사라진다)
  #
  # driver-class-name 과 database-platform 을 일부러 지정하지 않는다.
  # Spring Boot 가 JDBC URL 로 드라이버를, 커넥션 메타데이터로 방언을 알아내므로
  # 굳이 고정할 필요가 없고, 고정해두면 다른 DB 로 바꿀 때 그 값이 발목을 잡는다.
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: create-drop  # 개발 중: 자동 스키마 생성 및 초기화
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  # H2 Console (로컬 디버깅용)
  h2:
    console:
      enabled: true
      path: /h2-console

  # Thymeleaf
  thymeleaf:
    cache: false  # 개발 중: 템플릿 캐시 비활성화
    check-template-location: true

server:
  # 기본 8080. PORT 환경변수가 있으면 그 값을 쓴다.
  # 로컬에서 포트가 겹칠 때 PORT=9090 처럼 바꿔 띄울 수 있다.
  port: ${PORT:8080}

  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true    # JS에서 document.cookie로 세션을 읽지 못하게 한다
        same-site: lax     # 외부 사이트가 유발한 교차 출처 요청에 세션 쿠키를 싣지 않는다 (CSRF 토큰과 함께 이중 방어)
        # secure: true     # 배포(HTTPS) 시 활성화 — 로컬은 http라 켜면 로그인이 되지 않는다

logging:
  level:
    root: INFO
    com.securitybulletin: DEBUG
    org.springframework.security: DEBUG
