<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>로그인 · 보안 게시판</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container page-tall page-login">
	<h1 class="h3 mb-4">로그인</h1>

	<div class="alert alert-danger" role="alert" th:if="${param.error}">
		사용자명 또는 비밀번호가 올바르지 않습니다.
	</div>
	<div class="alert alert-success" role="alert" th:if="${param.logout}">
		로그아웃되었습니다.
	</div>
	<div class="alert alert-success" role="alert" th:if="${param.signup}">
		회원가입이 완료되었습니다. 로그인해주세요.
	</div>

	<!-- Spring Security가 CSRF 토큰(_csrf)을 이 폼에 자동으로 삽입한다 -->
	<form th:action="@{/auth/login}" method="post">
		<div class="mb-3">
			<label for="username" class="form-label">사용자명</label>
			<input type="text" class="form-control" id="username" name="username"
			       required autocomplete="username" autofocus>
		</div>

		<div class="mb-4">
			<label for="password" class="form-label">비밀번호</label>
			<input type="password" class="form-control" id="password" name="password"
			       required autocomplete="current-password">
		</div>

		<button type="submit" class="btn btn-primary w-100">로그인</button>
	</form>

	<p class="mt-3 mb-0 text-center">
		계정이 없나요? <a th:href="@{/auth/signup}">회원가입</a>
	</p>
</div>
</body>
</html>
