<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 · 보안 게시판</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container page-tall page-signup">
	<h1 class="h3 mb-4">회원가입</h1>

	<!-- 서버가 내려준 오류 메시지 (th:text는 자동 이스케이프되어 XSS를 막는다) -->
	<div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>

	<form th:action="@{/auth/signup}" th:object="${signupRequest}" method="post" novalidate>
		<div class="mb-3">
			<label for="username" class="form-label">사용자명</label>
			<input type="text" class="form-control" id="username" th:field="*{username}"
			       required minlength="3" maxlength="50" autocomplete="username">
			<div class="form-text text-danger" th:if="${#fields.hasErrors('username')}"
			     th:errors="*{username}"></div>
		</div>

		<div class="mb-3">
			<label for="email" class="form-label">이메일</label>
			<input type="email" class="form-control" id="email" th:field="*{email}"
			       required maxlength="100" autocomplete="email">
			<div class="form-text text-danger" th:if="${#fields.hasErrors('email')}"
			     th:errors="*{email}"></div>
		</div>

		<div class="mb-3">
			<label for="password" class="form-label">비밀번호</label>
			<input type="password" class="form-control" id="password" th:field="*{password}"
			       required minlength="8" autocomplete="new-password">
			<div class="form-text">최소 8자 이상 입력하세요.</div>
			<div class="form-text text-danger" th:if="${#fields.hasErrors('password')}"
			     th:errors="*{password}"></div>
		</div>

		<div class="mb-4">
			<label for="passwordConfirm" class="form-label">비밀번호 확인</label>
			<input type="password" class="form-control" id="passwordConfirm" th:field="*{passwordConfirm}"
			       required autocomplete="new-password">
			<div class="form-text text-danger" th:if="${#fields.hasErrors('passwordConfirm')}"
			     th:errors="*{passwordConfirm}"></div>
		</div>

		<button type="submit" class="btn btn-primary w-100">가입하기</button>
	</form>

	<p class="mt-3 mb-0 text-center">
		이미 계정이 있나요? <a th:href="@{/auth/login}">로그인</a>
	</p>
</div>
</body>
</html>
