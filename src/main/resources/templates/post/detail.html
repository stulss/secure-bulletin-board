<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${post.title} + ' · 보안 게시판'">게시글 · 보안 게시판</title>
	<link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
	<link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container page page-board">

	<article class="bg-white p-4 rounded border">
		<!-- th:text 이므로 <script> 를 넣어 저장해도 실행되지 않고 텍스트로 보인다 -->
		<h1 class="h4" th:text="${post.title}">제목</h1>

		<p class="text-muted small mb-4">
			<span th:text="${post.author.username}">작성자</span>
			·
			<span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-08-20</span>
			<span th:if="${post.updatedAt != post.createdAt}"
			      th:text="'(수정됨: ' + ${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')} + ')'"></span>
		</p>

		<!-- th:utext 를 쓰면 XSS 방어가 풀린다. 절대 바꾸지 말 것 -->
		<div class="post-content" th:text="${post.content}">본문</div>
	</article>

	<div class="mt-3 d-flex gap-2">
		<a th:href="@{/posts}" class="btn btn-outline-secondary btn-sm">목록</a>

		<!-- 버튼 노출은 편의일 뿐, 실제 인가는 Service 계층에서 다시 검증한다 -->
		<a th:if="${canEdit}" th:href="@{/posts/{id}/edit(id=${post.id})}"
		   class="btn btn-outline-primary btn-sm">수정</a>

		<!-- 확인창은 /js/app.js 가 붙여준다. 인라인 onsubmit 은 CSP가 막는다 -->
		<form th:if="${canEdit}" th:action="@{/posts/{id}/delete(id=${post.id})}" method="post"
		      data-confirm="이 게시글을 삭제할까요? 되돌릴 수 없습니다.">
			<button type="submit" class="btn btn-outline-danger btn-sm">삭제</button>
		</form>
	</div>

</div>
<script th:src="@{/js/app.js}" defer></script>
</body>
</html>
