# 배포(운영) 프로파일 — Cloudtype 기준
#
# 활성화: 환경변수 SPRING_PROFILES_ACTIVE=prod
# 이 파일은 저장소에 커밋되지만, 실제 접속 정보는 전부 환경변수로 주입받으므로
# 여기에 비밀번호가 들어가지 않는다. 값을 하드코딩하지 말 것.
#
# Cloudtype에 설정할 환경변수:
#   SPRING_PROFILES_ACTIVE = prod
#   DB_USER     = postgres  (또는 MySQL 사용자명)
#   DB_PASSWORD = (DB 배포 시 정한 Root Password)
#   DB_URL      = 아래 중 하나 — [DB 서비스명]:[포트] 형식의 내부 주소
#     PostgreSQL : jdbc:postgresql://postgresql-prod:5432/postgres
#     MySQL      : jdbc:mysql://mysql-prod:3306/bulletin?serverTimezone=Asia/Seoul
#
# 드라이버와 방언(dialect)은 고정하지 않는다.
# Spring Boot 가 JDBC URL 로 드라이버를, 실제 커넥션 메타데이터로 방언을 알아낸다.
# 덕분에 PostgreSQL 과 MySQL 중 무엇을 붙이든 이 파일을 고치지 않아도 된다.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # 운영에서 create-drop 은 절대 금지 — 재시작마다 데이터가 사라진다.
      # validate 는 엔티티와 실제 테이블이 어긋나면 기동을 거부하므로,
      # 스키마가 조용히 틀어진 채 돌아가는 상황을 막아준다.
      #
      # 최초 배포 시에는 테이블이 없어 기동에 실패한다.
      # db/schema-postgres.sql 또는 db/schema-mysql.sql 을 DB에 한 번 실행한 뒤 띄울 것.
      # (docs/05_배포.md 참고)
      ddl-auto: validate
    show-sql: false
    open-in-view: false   # 뷰 렌더링 중 커넥션을 붙잡지 않는다 (커넥션 고갈 방지)

  # 운영에서는 H2 콘솔을 열지 않는다.
  # 열어두면 DB 스키마와 데이터를 웹으로 노출하는 셈이 된다.
  h2:
    console:
      enabled: false

  thymeleaf:
    cache: true   # 운영에서는 템플릿 캐시를 켠다

server:
  # Cloudtype 등 배포 플랫폼이 PORT 를 주입한다. (기본값은 application.yml 의 8080)
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # HTTPS 전용 쿠키. Cloudtype 은 배포 도메인에 HTTPS 를 자동 적용하므로 켠다.
        # (로컬 http 에서 켜면 쿠키가 전송되지 않아 로그인이 되지 않는다 — 그래서 prod 에만 둔다)
        secure: true

  # 오류 화면에 스택 트레이스나 예외 메시지를 노출하지 않는다.
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false

logging:
  level:
    root: WARN
    com.securitybulletin: INFO
    # 운영에서 Security 디버그 로그는 남기지 않는다 — 인증 관련 내부 정보가 로그로 샌다.
    org.springframework.security: WARN
